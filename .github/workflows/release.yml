name: Release

on:
  workflow_run:
    workflows: [CI]
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: write # Required to create release
      pull-requests: write # Required to create PR
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch all history for all branches and tags so that changesets can
          # compare against the correct base branch
          fetch-depth: 0
          submodules: true

      - name: Install pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          install: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and run Dev Container task
        uses: devcontainers/ci@v0.3
        with:
          # Otherwise, "No runCmd set - skipping starting/running container".
          # Hence, using `true` no-op
          # (https://www.gnu.org/software/coreutils/manual/html_node/true-invocation.html)
          runCmd: true
          push: never
          cacheFrom: type=gha
          cacheTo: type=gha,mode=max

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Create pull request for version bump and publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: pnpm stage publish
          version: pnpm exec changeset version
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
